name: Verify pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate encrypted synthetic data
        run: npm run fixture
      - name: Test, build, and inspect the artifact
        env:
          BASE_PATH: "/${{ github.event.repository.name }}/"
        run: npm run check
